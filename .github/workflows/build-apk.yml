name: Apps bauen (Android + Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

defaults:
  run:
    shell: bash

jobs:
  web:
    name: Web-App zusammenstellen
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    outputs:
      android: ${{ steps.need.outputs.android }}
      desktop: ${{ steps.need.outputs.desktop }}
      native: ${{ steps.need.outputs.native }}
      ra: ${{ steps.need.outputs.ra }}
      re: ${{ steps.need.outputs.re }}
      appv: ${{ steps.build.outputs.appv }}
      pcv: ${{ steps.build.outputs.pcv }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: App-Code auf Syntaxfehler prüfen
        run: |
          python3 -c "import re;s=open('web/index.html',encoding='utf-8').read();open('/tmp/app.js','w',encoding='utf-8').write('\n'.join(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)))"
          node --check /tmp/app.js
          node --check web/pc.js
      - name: Muss Android/Windows neu gebaut werden?
        id: need
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(git rev-list --count HEAD -- android/); EXE=$(git rev-list --count HEAD -- desktop/)
          BODY=$(gh release view neueste --json body --jq .body 2>/dev/null || echo "")
          RA=$(echo "$BODY" | grep -o 'apk=[0-9]*' | cut -d= -f2 || true); RE=$(echo "$BODY" | grep -o 'exe=[0-9]*' | cut -d= -f2 || true)
          FORCE=${{ github.event_name == 'workflow_dispatch' }}
          if [ "$FORCE" = "true" ] || [ "$APK" != "$RA" ]; then echo "android=true" >> $GITHUB_OUTPUT; else echo "android=false" >> $GITHUB_OUTPUT; fi
          if [ "$FORCE" = "true" ] || [ "$EXE" != "$RE" ]; then echo "desktop=true" >> $GITHUB_OUTPUT; else echo "desktop=false" >> $GITHUB_OUTPUT; fi
          echo "ra=$RA" >> $GITHUB_OUTPUT; echo "re=$RE" >> $GITHUB_OUTPUT
          if [ "$FORCE" = "true" ] || [ "$APK" != "$RA" ] || [ "$EXE" != "$RE" ]; then echo "native=true" >> $GITHUB_OUTPUT; else echo "native=false" >> $GITHUB_OUTPUT; fi
          echo "Android: $APK (veröffentlicht $RA) · Windows: $EXE (veröffentlicht $RE)"
      - name: app.html bauen
        id: build
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=python; else PY=python3; fi
          BASE=0e2eef2
          APPV=$((129 + $(git rev-list --count $BASE..HEAD -- web/index.html android/)))
          PCV=$((75 + $(git rev-list --count $BASE..HEAD -- web/index.html web/pc.js web/pc.css desktop/)))
          echo "appv=$APPV" >> $GITHUB_OUTPUT; echo "pcv=$PCV" >> $GITHUB_OUTPUT
          echo "APPV=$APPV" >> $GITHUB_ENV; echo "PCV=$PCV" >> $GITHUB_ENV
          echo "Handy-Version $APPV · PC-Version $PCV"
          RATES=$(curl -fsS --max-time 20 https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml 2>/dev/null | $PY -c "import sys,re,json; x=sys.stdin.read(); d=re.search(r\"time=.(\\d{4}-\\d\\d-\\d\\d)\",x); r={c:float(v) for c,v in re.findall(r\"currency=.([A-Z]{3}). rate=.([\\d.]+)\",x)}; print(json.dumps({'d':d.group(1),'r':r},separators=(',',':')) if d and r else '')" 2>/dev/null) || RATES=""
          echo "EZB-Kurse: ${RATES:-keine (App nutzt Näherungswerte)}"
          {
            printf '<!doctype html><html lang="de"><head><meta charset="utf-8">'
            printf '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'
            printf '<meta name="hb-pair" content="https://miracleframe.synology.me/haushaltsbuch/pair.php">'
            printf '<meta name="hb-version" content="%s">' "${{ github.run_number }}"
            printf '<meta name="hb-ver-app" content="%s"><meta name="hb-ver-pc" content="%s">' "$APPV" "$PCV"
            if [ -n "$RATES" ]; then printf "<meta name=\"hb-rates\" content='%s'>" "$RATES"; fi
            printf '<title>Finanz MAMI</title>'
            printf '<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%%}[hidden]{display:none!important}</style>'
            printf '</head><body>'
            $PY -c "import sys;s=open('web/index.html',encoding='utf-8').read();s=s.replace('/*PC-JS*/',open('web/pc.js',encoding='utf-8').read(),1).replace('/*PC-CSS*/',open('web/pc.css',encoding='utf-8').read(),1);sys.stdout.buffer.write(s.encode('utf-8'))"
            printf '</body></html>'
          } > app.html
      - name: Code verkleinern
        run: |
          npm i --no-save --prefix /tmp/min terser@5.31.6 >/dev/null
          if [ "$RUNNER_OS" = "Windows" ]; then PY=python; else PY=python3; fi
          $PY tools/min.py app.html /tmp/min/node_modules/terser/bin/terser
      - name: pdf.js absichern (Prüfsummen, damit kein veränderter Fremdcode läuft)
        run: |
          for f in pdf.min.js pdf.worker.min.js; do
            h=$(curl -fsSL "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.2.146/build/$f" | openssl dgst -sha384 -binary | base64 -w0)
            [ -n "$h" ] || { echo "::error::pdf.js konnte nicht geladen werden"; exit 1; }
            if [ "$f" = pdf.min.js ]; then key=__PDFJS_SRI__; else key=__PDFJS_WORKER_SRI__; fi
            sed -i "s|$key|sha384-$h|" app.html
          done
          h=$(curl -fsSL "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js" | openssl dgst -sha384 -binary | base64 -w0)
          [ -n "$h" ] || { echo "::error::tesseract.js konnte nicht geladen werden"; exit 1; }
          sed -i "s|__TESS_SRI__|sha384-$h|" app.html
      - name: Sicherheitsregeln (CSP) setzen
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=python; else PY=python3; fi
          $PY tools/csp.py app.html
      - name: App signieren (Handy und PC übernehmen nur signierte Updates)
        env:
          HB_SIGN_KEY: ${{ secrets.HB_SIGN_KEY }}
        run: |
          if [ -z "$HB_SIGN_KEY" ]; then echo "::error::Das Secret HB_SIGN_KEY fehlt (Einstellungen > Secrets and variables > Actions)"; exit 1; fi
          printf '%s\n' "$HB_SIGN_KEY" > k.pem
          sig=$(openssl dgst -sha256 -sign k.pem app.html | base64 -w0)
          rm -f k.pem
          printf '\n<!--hb-sig:%s-->\n' "$sig" >> app.html
      - name: Zwischenstand ablegen (statt Actions-Artefakten, deren Speicher begrenzt ist)
        if: ${{ steps.need.outputs.native == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in $(gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '.[].tag_name' | grep '^build-'); do
            gh release delete "$t" -y --cleanup-tag || true
          done
          gh release create build-${{ github.run_number }} app.html --prerelease --title "Zwischenstand build-${{ github.run_number }}" --notes "Wird nach dem Build automatisch gelöscht." --target ${{ github.sha }}

      - name: Fertige App für Tests und Veröffentlichung bereitlegen
        uses: actions/upload-artifact@v4
        with:
          name: app-html
          path: app.html
          retention-days: 1

  gesten:
    name: Gesten-Test (Handy + Tablet)
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testbrowser
        run: |
          npm i --no-save --prefix /tmp/pw playwright@1.48.2 >/dev/null
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium >/dev/null
      - name: Wischen, Tippen, Zurück auf allen Seiten prüfen
        run: |
          python3 tools/test/mk_harness.py . /tmp/hbtest
          (cd /tmp/hbtest && nohup python3 -m http.server 8078 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 1
          NODE_PATH=/tmp/pw/node_modules node tools/test/gesten.cjs http://127.0.0.1:8078/app.html /tmp/hbtest/shots
      - name: Bildschirmfotos bei Fehler
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gesten-fotos
          path: /tmp/hbtest/shots
          retention-days: 3

  android-test:
    name: Android-Test (${{ matrix.name }})
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Handy-Emulator in der Cloud ist noch unzuverlässig: meldet Fehler, hält den Build aber nicht an
    continue-on-error: ${{ !matrix.blocking }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Handy
            profile: pixel_6
            blocking: false
          - name: Tablet
            profile: pixel_c
            blocking: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: app-html
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test-App „MAMI Test“ bauen (läuft neben der echten App)
        run: |
          mkdir -p android/app/src/main/assets
          cp app.html android/app/src/main/assets/index.html
          git rev-list --count HEAD -- android/ > android/app/src/main/assets/native.txt
          cd android
          if ! gradle assembleDebug --no-daemon > ../gradle.log 2>&1; then
            grep -v "^> Task" ../gradle.log | grep -E -A3 "error|What went wrong|FAILURE" | head -60 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testwerkzeug
        run: npm i --no-save --prefix /tmp/pw playwright@1.48.2 >/dev/null
      - name: Emulator beschleunigen (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Auf Android-${{ matrix.name }} wischen, tippen, Zurück-Taste
        uses: reactivecircus/android-emulator-runner@v2
        env:
          NODE_PATH: /tmp/pw/node_modules
          HB_RUN: ${{ github.run_number }}
          HB_DEVICE: ${{ matrix.name }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -memory 4096 -cores 4 -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash tools/test/android-run.sh android/app/build/outputs/apk/debug/app-debug.apk /tmp/shots
      - name: Test-App für den Handy-Test am PC bereitstellen
        if: ${{ always() && matrix.name == 'Tablet' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MAMI-Test.apk
          gh release view testfotos >/dev/null 2>&1 || gh release create testfotos --prerelease --title "Testfotos (automatisch)" --notes "Bildschirmfotos der automatischen Android-Tests und die Test-App MAMI Test. Wird bei jedem Build ersetzt." || true
          gh release upload testfotos MAMI-Test.apk --clobber
      - name: Bildschirmfotos ablegen (Release „testfotos“, wird jedes Mal ersetzt)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls /tmp/shots/*.png >/dev/null 2>&1 || exit 0
          gh release view testfotos >/dev/null 2>&1 || gh release create testfotos --prerelease --title "Testfotos (automatisch)" --notes "Bildschirmfotos der automatischen Android-Tests. Wird bei jedem Build ersetzt." || true
          for f in $(gh release view testfotos --json assets -q '.assets[].name' | grep "^${{ matrix.name }}-" || true); do gh release delete-asset testfotos "$f" -y || true; done
          gh release upload testfotos /tmp/shots/*.png --clobber

  ios:
    name: iPhone-App (ohne Signatur)
    needs: web
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-html
          path: dl
      - name: Web-App einpacken
        run: |
          mkdir -p ios/www && cp dl/app.html ios/www/index.html
          ls -la ios/www
      - name: Xcode-Projekt erzeugen
        run: |
          brew install xcodegen >/dev/null
          cd ios && xcodegen generate
      - name: Für den Simulator bauen
        run: |
          cd ios
          N=${{ github.run_number }}
          xcodebuild -project FinanzMAMI.xcodeproj -scheme FinanzMAMI -configuration Release -sdk iphonesimulator \
            -derivedDataPath build/sim MARKETING_VERSION=0.$((N/10)).$((N%10)) CURRENT_PROJECT_VERSION=$N CODE_SIGNING_ALLOWED=NO build | tail -25
      - name: Im iPhone-Simulator starten (Start-Test mit Bildschirmfoto)
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import sys,json;d=json.load(sys.stdin)['devices'];l=[x for k in sorted(d,reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone') and 'Pro Max' not in x['name']];print(l[0]['udid'])")
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find ios/build/sim -name "FinanzMAMI.app" -type d | head -1)
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" de.sascha.haushaltsbuch
          sleep 25
          mkdir -p shots && xcrun simctl io "$UDID" screenshot shots/iphone-start.png
          xcrun simctl spawn "$UDID" launchctl list | grep -q haushaltsbuch && echo "App läuft" || { echo "::error::Die iPhone-App läuft nach dem Start nicht"; exit 1; }
      - name: Fürs iPhone bauen (unsigniert – zum Hochladen braucht es später das Apple-Konto)
        run: |
          cd ios
          N=${{ github.run_number }}
          xcodebuild -project FinanzMAMI.xcodeproj -scheme FinanzMAMI -configuration Release -sdk iphoneos -derivedDataPath build/dev \
            MARKETING_VERSION=0.$((N/10)).$((N%10)) CURRENT_PROJECT_VERSION=$N CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -15
          APP=$(find build/dev -name "FinanzMAMI.app" -type d -path "*iphoneos*" | head -1)
          mkdir -p Payload && cp -R "$APP" Payload/ && zip -qry ../FinanzMAMI-unsigniert.ipa Payload
          ls -la ../FinanzMAMI-unsigniert.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: iphone-app
          path: |
            FinanzMAMI-unsigniert.ipa
            shots/iphone-start.png
          retention-days: 14
      - name: Bildschirmfoto ablegen (Release „testfotos“)
        if: always()
        run: |
          [ -f shots/iphone-start.png ] || exit 0
          gh release view testfotos >/dev/null 2>&1 || gh release create testfotos --prerelease --title "Testfotos (automatisch)" --notes "Bildschirmfotos der automatischen Tests."
          gh release upload testfotos shots/iphone-start.png --clobber

  web-release:
    name: Veröffentlichen (nur App-Inhalt)
    needs: [web, gesten, android-test]
    if: ${{ needs.web.outputs.native == 'false' }}
    runs-on: ubuntu-latest
    env:
      APPV: ${{ needs.web.outputs.appv }}
      PCV: ${{ needs.web.outputs.pcv }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: app-html
      - name: Veröffentlichen (nur App-Inhalt geändert – Handy- und PC-App bleiben)
        if: ${{ needs.web.outputs.native == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download neueste -p Haushaltsbuch.apk -p Haushaltsbuch-Setup.exe -D . --clobber
          TITLE="Finanz MAMI · v0.$(( (${{ github.run_number }} - 88) / 10 )).$(( (${{ github.run_number }} - 88) % 10 )) · Handy, Tablet & PC"
          NOTES="Neueste Version. Handy: Haushaltsbuch.apk installieren. PC (Windows): Haushaltsbuch-Setup.exe ausführen. Versionen für die automatischen Updates: web=${{ github.run_number }} apk=${{ needs.web.outputs.ra }} exe=${{ needs.web.outputs.re }} appv=$APPV pcv=$PCV"
          if gh release view neueste >/dev/null 2>&1; then
            for i in 1 2 3 4; do gh release upload neueste Haushaltsbuch.apk Haushaltsbuch-Setup.exe app.html --clobber && break; [ $i = 4 ] && exit 1; echo "Hochladen fehlgeschlagen – neuer Versuch in 20 s"; sleep 20; done
            gh release edit neueste --title "$TITLE" --notes "$NOTES" --latest
            git tag -f neueste ${{ github.sha }} && git push -f origin refs/tags/neueste || true
          else
            gh release create neueste Haushaltsbuch.apk Haushaltsbuch-Setup.exe app.html --title "$TITLE" --notes "$NOTES" --latest
          fi
          for t in $(gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '.[].tag_name' | grep '^build-'); do
            gh release delete "$t" -y --cleanup-tag || true
          done
          rm -f Haushaltsbuch.apk Haushaltsbuch-Setup.exe

  android:
    name: Android-App (APK)
    needs: web
    if: ${{ needs.web.outputs.android == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: app.html holen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download build-${{ github.run_number }} -p app.html -D . --clobber
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: APK bauen
        env:
          HB_KEYSTORE: ${{ secrets.HB_KEYSTORE }}
          HB_KEYSTORE_PASS: ${{ secrets.HB_KEYSTORE_PASS }}
        run: |
          if [ -n "$HB_KEYSTORE" ]; then
            printf '%s' "$HB_KEYSTORE" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/hb.jks"
            export HB_KEYSTORE_FILE="$RUNNER_TEMP/hb.jks"
            [ -n "$HB_KEYSTORE_PASS" ] || { echo "::error::Secret HB_KEYSTORE_PASS fehlt"; exit 1; }
            echo "Signierschlüssel aus den Secrets"
          elif [ ! -f android/keystore/haushaltsbuch.jks ]; then
            echo "::error::Secret HB_KEYSTORE fehlt (Signierschlüssel fürs Handy)"; exit 1
          else
            echo "::warning::Signierschlüssel noch aus dem Projekt – bitte die Secrets HB_KEYSTORE und HB_KEYSTORE_PASS anlegen"
            unset HB_KEYSTORE_PASS
          fi
          mkdir -p android/app/src/main/assets
          cp app.html android/app/src/main/assets/index.html
          git rev-list --count HEAD -- android/ > android/app/src/main/assets/native.txt
          cd android
          if ! gradle assembleRelease --no-daemon > ../gradle.log 2>&1; then
            grep -v "^> Task" ../gradle.log | grep -E -A3 "error|What went wrong|FAILURE|Could not|Execution failed" | head -60 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk ../Haushaltsbuch.apk
          rm -f "$RUNNER_TEMP/hb.jks"
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$SIGNER" ]; then
            FP=$("$SIGNER" verify --print-certs ../Haushaltsbuch.apk | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}' | tr 'A-F' 'a-f')
            if [ "$FP" != "49c1cb354a39f64972cce694034d6b68e977ff6f90423604d33fbabab8ded971" ]; then echo "::error::APK ist mit einem anderen Schlüssel signiert ($FP) – Secret HB_KEYSTORE prüfen"; exit 1; fi
            echo "APK-Signatur stimmt"
          else echo "::warning::apksigner nicht gefunden – Signatur nicht geprüft"; fi
      - name: APK ablegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload build-${{ github.run_number }} Haushaltsbuch.apk --clobber

  windows-test:
    name: Windows-App testen (Start + Abgleich)
    needs: web
    if: ${{ needs.web.outputs.desktop == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: app.html holen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download build-${{ github.run_number }} -p app.html -D desktop --clobber
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testumgebung
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb php-cli php-sqlite3 >/dev/null
      - name: Test-Synology starten
        run: |
          mkdir -p /tmp/srv/haushaltsbuch
          sed 's/__DATA_SUFFIX__/test/' server/api.php > /tmp/srv/haushaltsbuch/api.php
          (cd /tmp/srv && nohup php -S 127.0.0.1:8099 >/tmp/php.log 2>&1 &)
          sleep 1
          curl -fsS "http://127.0.0.1:8099/haushaltsbuch/api.php?a=status"
      - name: App starten und prüfen
        working-directory: desktop
        env:
          SMOKE_SERVER: http://127.0.0.1:8099/haushaltsbuch/api.php
        run: |
          for i in 1 2 3; do npm install --no-audit --no-fund && break; echo "Download fehlgeschlagen, neuer Versuch in 60 s"; sleep 60; done
          xvfb-run -a npm run smoke

  windows:
    name: Windows-App (Installer)
    needs: web
    if: ${{ needs.web.outputs.desktop == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: app.html holen
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release download build-${{ github.run_number }} -p app.html -D desktop --clobber
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Version des PC-Teils
        shell: bash
        run: |
          echo "{\"rev\": $(git rev-list --count HEAD -- desktop/)}" > desktop/native.json
          cat desktop/native.json
      - name: Versionsnummer des PC (eigene Zählung, Build 143 = v0.0.1)
        shell: bash
        working-directory: desktop
        run: |
          N=$(( ${{ github.run_number }} - 142 ))
          npm pkg set version="0.$((N/10)).$((N%10))"
      - name: Installer bauen
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        shell: bash
        run: |
          for i in 1 2 3; do npm install --no-audit --no-fund && break; echo "Download fehlgeschlagen, neuer Versuch in 60 s"; sleep 60; done
          for i in 1 2 3; do npm run dist && break; echo "Bauen fehlgeschlagen, neuer Versuch in 60 s"; sleep 60; done
          test -f dist/Haushaltsbuch-Setup.exe
      - name: Installer ablegen
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload build-${{ github.run_number }} desktop/dist/Haushaltsbuch-Setup.exe --clobber

  release:
    name: Veröffentlichen
    needs: [web, android, windows, windows-test, gesten, android-test]
    if: ${{ always() && needs.web.result == 'success' && needs.web.outputs.native == 'true' && needs.gesten.result == 'success' && needs.android-test.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # signiertes GitHub-Token, mit dem die Synology neue Versionen annimmt
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Downloads bereitstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download build-${{ github.run_number }} -D . --clobber
          ls -la
          APK=$(git rev-list --count HEAD -- android/); EXE=$(git rev-list --count HEAD -- desktop/)
          if [ ! -f Haushaltsbuch.apk ]; then
            gh release download neueste -p Haushaltsbuch.apk -D . --clobber
            APK=$(gh release view neueste --json body --jq .body | grep -o 'apk=[0-9]*' | cut -d= -f2)
            echo "Android-Build fehlt – bisherige APK bleibt (apk=$APK)"
          fi
          if [ ! -f Haushaltsbuch-Setup.exe ]; then
            gh release download neueste -p Haushaltsbuch-Setup.exe -D . --clobber
            EXE=$(gh release view neueste --json body --jq .body | grep -o 'exe=[0-9]*' | cut -d= -f2)
            echo "Windows-Build fehlt – bisheriger Installer bleibt (exe=$EXE)"
          fi
          TITLE="Finanz MAMI · v0.$(( (${{ github.run_number }} - 88) / 10 )).$(( (${{ github.run_number }} - 88) % 10 )) · Handy, Tablet & PC"
          NOTES="Neueste Version. Handy: Haushaltsbuch.apk installieren. PC (Windows): Haushaltsbuch-Setup.exe ausführen. Versionen für die automatischen Updates: web=${{ github.run_number }} apk=$APK exe=$EXE appv=${{ needs.web.outputs.appv }} pcv=${{ needs.web.outputs.pcv }}"
          if gh release view neueste >/dev/null 2>&1; then
            for i in 1 2 3 4; do gh release upload neueste Haushaltsbuch.apk Haushaltsbuch-Setup.exe app.html --clobber && break; [ $i = 4 ] && exit 1; echo "Hochladen fehlgeschlagen – neuer Versuch in 20 s"; sleep 20; done
            gh release edit neueste --title "$TITLE" --notes "$NOTES" --latest
            git tag -f neueste ${{ github.sha }} && git push -f origin refs/tags/neueste || true
          else
            gh release create neueste Haushaltsbuch.apk Haushaltsbuch-Setup.exe app.html --title "$TITLE" --notes "$NOTES" --latest
          fi
          for t in $(gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '.[].tag_name' | grep '^build-'); do
            gh release delete "$t" -y --cleanup-tag || true
          done

