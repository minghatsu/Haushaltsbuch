name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Web-App in die APK packen
        run: |
          mkdir -p android/app/src/main/assets
          {
            printf '<!doctype html><html lang="de"><head><meta charset="utf-8">'
            printf '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'
            printf '<meta name="hb-server" content="http://192.168.178.32/haushaltsbuch/api.php">'
            printf '<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%%}[hidden]{display:none!important}</style>'
            printf '</head><body>'
            cat web/index.html
            printf '</body></html>'
          } > android/app/src/main/assets/index.html

      - name: APK bauen
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: APK als Download bereitstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Haushaltsbuch.apk
          gh release delete neueste -y --cleanup-tag || true
          gh release create neueste Haushaltsbuch.apk \
            --title "Haushaltsbuch (Build ${{ github.run_number }})" \
            --notes "Neueste Version. Auf dem Handy herunterladen und installieren."
